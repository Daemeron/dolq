name: Build and Test - CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      # the release builds on Windows too, so catch unix-only calls here
      - run: GOOS=windows go vet ./...
        working-directory: backend
      - run: test -z "$(gofmt -l .)"
        working-directory: backend
      # race detector plus a minimum total coverage (backend/scripts/check-coverage.sh)
      - run: ./scripts/check-coverage.sh
        working-directory: backend

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npx biome ci .
      - run: npm run frontend:typecheck
      - run: npx electron-vite build
      # fails below the thresholds in vitest.config.mts
      - run: npx vitest run --coverage
      # npm ci skipped the Electron download above; the smoke test needs the real binary
      - run: node node_modules/electron/install.js
      - run: xvfb-run --auto-servernum npx playwright test
