name: Build and Test - CI

on:
  push:
    branches:
      - main
  pull_request:

# The checks are separate jobs so they run side by side, which takes the time of the slowest rather than the sum of all.
# The ruleset on main requires one check called "build-and-test", so the last job of that name gathers their results.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      # the release builds on Windows too, so catch unix-only calls here
      - run: GOOS=windows go vet ./...
        working-directory: backend
      - run: test -z "$(gofmt -l .)"
        working-directory: backend
      # race detector plus a minimum total coverage (backend/scripts/check-coverage.sh)
      - run: ./scripts/check-coverage.sh
        working-directory: backend
        env:
          COVERAGE_OUT: ${{ github.workspace }}/backend-coverage.txt
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: backend-coverage
          path: backend-coverage.txt
          retention-days: 1

  lint:
    name: Lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npx biome ci .
      - run: npm run frontend:typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # fails below the thresholds in vitest.config.mts
      - run: npx vitest run --coverage
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: frontend-coverage
          path: coverage/coverage-summary.json
          retention-days: 1

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # the app builds its own backend from source when it is not packaged
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # the smoke test needs the real Electron binary, so it is downloaded here
      - run: npm ci
      - run: npx electron-vite build
      - run: xvfb-run --auto-servernum npx playwright test

  # The name the ruleset on main requires. Passes only when every check above did.
  build-and-test:
    needs: [backend, lint, unit-tests, e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  # The README shows the coverage badges from the badges branch, which only a push to main updates.
  coverage-badges:
    name: Coverage badges
    if: github.event_name == 'push'
    needs: [backend, unit-tests]
    runs-on: ubuntu-24.04
    # Only this job writes anything.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: backend-coverage
      - uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: coverage
      - name: Publish coverage badges
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/write-coverage-badges.mjs
          if git ls-remote --exit-code --heads "$REMOTE" badges >/dev/null; then
            git clone --quiet --depth 1 --branch badges "$REMOTE" "$RUNNER_TEMP/badges"
          else
            git init --quiet --initial-branch badges "$RUNNER_TEMP/badges"
            git -C "$RUNNER_TEMP/badges" remote add origin "$REMOTE"
          fi
          cp badges/*.json "$RUNNER_TEMP/badges/"
          cd "$RUNNER_TEMP/badges"
          git add .
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit --quiet -m "Update coverage badges"
            git push --quiet origin badges
          fi
