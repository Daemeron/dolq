name: Create a Release - Build Binaries

on:
  release:
    types: [created]
  # A manual run builds the ref it is started from; give it the tag of an
  # existing release to build that tag and attach the binaries to it.
  # Without one it only builds (a dry run) and skips the upload.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload to (e.g. dolq-v0.1.4); leave empty to only build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
        working-directory: backend
      - run: test -z "$(gofmt -l .)"
        working-directory: backend
        shell: bash
      - run: go test ./...
        working-directory: backend

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: go build -C backend -o bin/ ./cmd/dolqd
      - run: npx electron-vite build
      - run: npx electron-builder
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - run: npx electron-builder
        if: runner.os != 'Windows'
      - name: Upload macOS assets
        if: runner.os == 'macOS' && env.TAG != ''
        run: gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Linux assets
        if: runner.os == 'Linux' && env.TAG != ''
        run: gh release upload "$TAG" dist/*.AppImage dist/*.deb --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows assets
        if: runner.os == 'Windows' && env.TAG != ''
        run: gh release upload $env:TAG (Get-Item dist/*.exe) --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
