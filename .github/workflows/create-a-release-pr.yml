name: Create a Release - PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force this version part to bump, overriding the automatic conventional-commits detection'
        type: choice
        options:
          - automatic
          - patch
          - minor
          - major
        default: automatic
      release-as:
        description: 'Force an exact next version instead (e.g. 1.2.3) - takes priority over "bump" above if set'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      # release-please-action only honours its release-as/versioning-strategy
      # inputs when release-type is set, which bypasses release-please-config.json
      # (and with it our PR title pattern and dolq-v tags). In manifest mode the
      # only per-run override release-please offers is the CLI's --release-as,
      # so a forced bump is turned into an exact version from the manifest here.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BUMP: ${{ inputs.bump }}
          RELEASE_AS: ${{ inputs.release-as }}
        run: |
          version="$RELEASE_AS"
          if [ -z "$version" ] && [ "$BUMP" != automatic ]; then
            IFS=. read -r major minor patch <<< "$(jq -r '."."' .release-please-manifest.json)"
            patch="${patch%%[-+]*}"
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          npx --yes release-please@17 release-pr \
            --token="$GH_TOKEN" --repo-url="$GITHUB_REPOSITORY" \
            ${version:+--release-as="$version"}
