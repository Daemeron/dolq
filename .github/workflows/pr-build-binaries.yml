name: PR - Build Binaries

# The last gate before a merge: once a pull request is reviewed, build the real
# installers for macOS, Linux and Windows from its head commit and report the
# result as the commit status "Build Binaries", which main's ruleset requires.
#
# Start it by approving the pull request, or by hand once you are satisfied:
#   gh workflow run pr-build-binaries.yml -f pr=<number>
# It refuses to start until the CI check ("build-and-test") has passed on that
# commit, so the order is always CI, then review, then binaries. A new push
# changes the head commit, and the status belongs to the old one, so the
# binaries have to be built again.
on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Number of the reviewed pull request to build'
        required: true

# Building runs the pull request's code, so nothing here may write to the repository.
permissions:
  contents: read
  checks: read
  pull-requests: read
  statuses: write

# Not cancelled by a newer run: a plain review comment also starts this workflow (and skips the gate), and
# must not stop a build that is already running.
concurrency:
  group: pr-build-binaries-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

env:
  STATUS_CONTEXT: Build Binaries

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || github.event.review.state == 'approved'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - id: pr
        run: |
          read -r sha fork state < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid,isCrossRepository,state \
            --jq '"\(.headRefOid) \(.isCrossRepository) \(.state)"')
          [ "$state" = OPEN ] || { echo "::error::Pull request $PR is not open"; exit 1; }
          [ "$fork" = false ] || { echo "::error::Only pull requests from this repository are built"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: CI has to have passed on this commit first
        env:
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "build-and-test")] | sort_by(.started_at) | last | .conclusion')
          [ "$conclusion" = success ] || { echo "::error::CI (build-and-test) has not passed on $SHA (it is: ${conclusion:-missing})"; exit 1; }

      - name: Mark the commit as building
        env:
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f description="Building on macOS, Linux and Windows" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # Keep these steps in line with create-a-release-build-binaries.yml, minus the release upload.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
        working-directory: backend
      - run: test -z "$(gofmt -l .)"
        working-directory: backend
        shell: bash
      - run: go test ./...
        working-directory: backend

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: go build -C backend -o bin/ ./cmd/dolqd
      - run: npx electron-vite build
      - run: npx electron-builder

  report:
    needs: [gate, build]
    # Runs even when a build failed, so the status never stays on "pending".
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Report the result on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
          RESULT: ${{ needs.build.result }}
        run: |
          if [ "$RESULT" = success ]; then
            state=success; description="Installers built on macOS, Linux and Windows"
          else
            state=failure; description="A build failed or was cancelled"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
