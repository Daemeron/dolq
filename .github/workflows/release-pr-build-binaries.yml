name: Release PR - Build Binaries

# A release must never be broken, so the release pull request builds the real
# installers for macOS, Linux and Windows before it can be merged. Every other
# pull request skips the build and passes the "Build Binaries" check at once,
# which lets main's ruleset require that check on all of them.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    # release-please opens the release pull request from this branch.
    if: startsWith(github.head_ref, 'release-please--')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # Keep these steps in line with create-a-release-build-binaries.yml, minus the release upload.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
        working-directory: backend
      - run: test -z "$(gofmt -l .)"
        working-directory: backend
        shell: bash
      - run: go test ./...
        working-directory: backend

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # electron-builder downloads Electron and its packaging tools on every run
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: go build -C backend -o bin/ ./cmd/dolqd
      - run: npx electron-vite build
      - run: npx electron-builder --publish never

      # The app has to be signed as itself, even ad hoc. Unsigned, macOS cannot tell Dolq from any other Electron app and
      # refuses it the local network ("no route to host"), and electron-builder skips signing without a word when its
      # configuration is wrong.
      - name: Check the macOS app is signed as Dolq
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d dist/mac*/Dolq.app | head -1)
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -q '^Identifier=com.daemeron.dolq$'
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$app/Contents/Info.plist" >/dev/null

      # Kept for the release: when it is published from this very tree, create-a-release-build-binaries.yml uploads
      # these installers as they are, instead of building them a second time.
      - name: Record the tree the installers were built from
        shell: bash
        run: git rev-parse 'HEAD^{tree}' > dist/TREE
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest*.yml
            dist/TREE
          retention-days: 7
          if-no-files-found: error

  # One check with a fixed name for the ruleset to require: a skipped matrix job has no stable name of its own.
  result:
    name: Build Binaries
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          BUILD: ${{ needs.build.result }}
        run: |
          echo "builds: $BUILD"
          case "$BUILD" in success|skipped) ;; *) exit 1 ;; esac
