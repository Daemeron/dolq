#:schema https://json.schemastore.org/any.json
# air - npm's `backend:dev` script. Trimmed to just what differs
# from `air init`'s own defaults; everything else stays default.

root = "."
tmp_dir = "tmp"

[build]
  # The .exe suffix is for Windows, where air only runs files that have it; other platforms ignore it.
  cmd = "go build -o ./tmp/dolqd.exe ./cmd/dolqd"
  entrypoint = ["./tmp/dolqd.exe"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin"]
  # dolqd already handles SIGINT/SIGTERM for a graceful shutdown (flushing
  # queued history writes, closing sessions) - send_interrupt makes air use
  # that instead of a hard kill on every rebuild.
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = true
