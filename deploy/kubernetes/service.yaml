# NodePort works on any cluster (k3s, TrueNAS SCALE, Synology, ...): clients
# connect to <NAS address>:30789. If your cluster has a load balancer (MetalLB,
# k3s servicelb), switch to `type: LoadBalancer`, drop nodePort, and set
# DOLQ_PUBLIC_PORT to 6789.
apiVersion: v1
kind: Service
metadata:
  name: dolqd
  namespace: dolq
  labels:
    app.kubernetes.io/name: dolqd
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dolqd
  ports:
    - name: dolqd
      port: 6789
      targetPort: dolqd
      nodePort: 30789
