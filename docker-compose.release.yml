## ==============================================================================
##  Dolq backend (dolqd), from its published image
## ==============================================================================
##
##  Nothing needs setting up first: put this file in a folder on the NAS and start
##  it, as it is.
##
##      docker compose -f docker-compose.release.yml up -d
##
##  (or add it as a project in Container Manager, Portainer or the like).
##
##  How to read this file
##
##      ## Text like this, behind two hashes, explains a setting.
##      #SETTING: value     <- a setting that is switched off, behind one hash.
##                             Remove that one "#", and only it, to switch it on.
##
##  Every setting dolqd has is here, so nothing has to be looked up elsewhere.
##
##  Pairing a client
##
##      docker compose -f docker-compose.release.yml logs dolqd
##
##  On first start dolqd prints a pairing link (dolq://host:6789?token=...&fp=...).
##  Paste one of the links into a client's Preferences > Remote Backend.
##
##  Checking that it works
##
##      docker compose -f docker-compose.release.yml logs -f dolqd
##
##  "ready, listening on ..." says it started. "client <address>: connected" and
##  "authenticated" say an app has paired with it. After that it logs what it does:
##  the IRC servers it connects to, the channels you join and leave, and the files it
##  receives. "rejected" means a client has the wrong token; a client that never
##  shows up cannot reach the port.
##
## ==============================================================================

services:
  dolqd:

    ## ==========================================================================
    ##  Image
    ## ==========================================================================
    ##  0.13 follows the 0.13.x releases. Use 0.13.0 to stay on exactly that one.
    image: ghcr.io/daemeron/dolqd:0.13

    restart: unless-stopped

    ## ==========================================================================
    ##  Name
    ## ==========================================================================
    ##  A fixed name for the container, so `docker logs dolqd` and `docker exec
    ##  dolqd ...` work, and it shows under that name in the NAS's container app.
    ##  Without it Docker makes one up from the folder and service, such as
    ##  dolq-dolqd-1. A name can belong to only one container at a time, so it
    ##  cannot be used by two copies of this file.
    #container_name: dolqd

    ## ==========================================================================
    ##  Terminal
    ## ==========================================================================
    ##  Keep the container's input open and give it a terminal, as `docker run -it`
    ##  does, like your other containers. `docker attach` then shows what dolqd
    ##  prints, and a console opened from the NAS's container app works. dolqd
    ##  itself reads no input and does not need them. Leave an attached terminal
    ##  with Ctrl-P then Ctrl-Q: Ctrl-C stops dolqd.
    stdin_open: true
    tty: true

    ## ==========================================================================
    ##  Network
    ## ==========================================================================
    ##  The host's own network. The pairing link then names the NAS's real
    ##  addresses without being told them, and the ports DCC file transfers open
    ##  can be reached. Port 6789 on the NAS must be free.
    network_mode: host

    ##  Where host networking is not available (Docker Desktop on a Mac or Windows
    ##  PC), or the port is taken: remove "network_mode: host" above, switch these
    ##  on, and name the machine in the pairing link (see DOLQ_PUBLIC_HOST below).
    ##  The first number is the port on the NAS; clients connect to it.
    #ports:
    #  - '6789:6789'

    ## ==========================================================================
    ##  Environment
    ## ==========================================================================
    environment:

      ##  Who dolqd runs as, and so who owns the files it writes: the user and group
      ##  of the NAS that should own them (see them with `id <user>`; the same
      ##  numbers as in your other containers). The folders Docker creates here are
      ##  handed to them at every start. One that already exists, such as a share,
      ##  is left as it is, so it has to belong to, or be writable for, this user.
      ##  Without these, dolqd runs as 10001.
      - "PUID=1000"
      - "PGID=100"

      ##  The time zone of the times in the log, such as Europe/Berlin. History is
      ##  always kept in UTC, so this changes nothing else.
      - "TZ=Etc/UTC"

      ##  Where XDCC downloads are saved. A client cannot choose another folder. It
      ##  is the folder mounted at /downloads under "volumes" below: change that
      ##  mount to save somewhere else, and leave this as it is.
      - "DOLQ_DOWNLOAD_DIR=/downloads"

      ##  The access token clients present, instead of one that dolqd generates on
      ##  first start and keeps in the data folder. Anyone with it can use your
      ##  IRC sessions, so choose a long one.
      #- "DOLQ_TOKEN=change-this-to-something-long-and-random"

      ##  The name or IP that the pairing link gives clients. Needed only without
      ##  host networking, where dolqd cannot tell what address the NAS has from
      ##  the outside.
      #- "DOLQ_PUBLIC_HOST=my-nas.local"

      ##  The port the pairing link gives clients, when it is not the one dolqd
      ##  listens on: the left number of a mapping such as '7000:6789' under "ports".
      #- "DOLQ_PUBLIC_PORT=6789"

      ##  Also accept plain connections without a token, on the same port, for
      ##  clients from before access tokens existed. Anyone who can reach the port
      ##  can then use it. Cannot be combined with -tls=false or -token=false.
      #- "DOLQ_ALLOW_LEGACY_PLAIN=1"

    ## ==========================================================================
    ##  Command line options
    ## ==========================================================================
    ##  The settings that have no environment variable are options of dolqd. Switch
    ##  on "command:" and the options you want under it; the others stay off.
    ##
    ##  -retention-days   delete history older than this many days (0 keeps all)
    ##  -print-pairing    log the pairing link at every start, not only the first
    ##                    (it contains the token, so it ends up in the logs)
    ##  -tls=false        plain TCP instead of TLS, for behind a proxy or a tunnel
    ##  -token=false      no access token: anyone who can reach the port can use it
    ##  -tls-cert, -tls-key
    ##                    your own certificate and key (PEM files in the data
    ##                    folder, as /data/...), instead of the generated one
    ##  -acme-domain      a Let's Encrypt certificate for this domain. Needs port
    ##                    443 reachable from the internet, so without host
    ##                    networking and with ports '443:6789'
    ##  -acme-email       where Let's Encrypt sends expiry notices (optional)
    ##  -acme-staging     Let's Encrypt's test service, with untrusted certificates
    ##
    #command:
    #  - -retention-days=90
    #  - -print-pairing
    #  - -tls=false
    #  - -token=false
    #  - -tls-cert=/data/my-cert.pem
    #  - -tls-key=/data/my-key.pem
    #  - -acme-domain=dolq.example.org
    #  - -acme-email=me@example.org
    #  - -acme-staging

    ## ==========================================================================
    ##  Folders (left of the colon: on the NAS. Right of it: inside the container.)
    ## ==========================================================================
    ##  The folders below are next to this file, so they exist as long as this file
    ##  does, and Docker creates them on the first start.
    ##
    ##  A path to somewhere else on the NAS, such as a file share, is different. If
    ##  that share is gone (not mounted yet after a restart, or lost), Docker does
    ##  not complain: it creates an empty folder at that path on the NAS's small
    ##  system disk, and dolqd writes there until the disk is full, with "no space
    ##  left on device" for an error. For such a path use the longer form shown
    ##  below, where a missing folder stops the container from starting instead.
    ##
    ##  Use the share's real path: /volume1/<ShareName> on Synology, and
    ##  /share/<ShareName> on QNAP (a path such as /<ShareName>, without /share, is
    ##  not the share but a folder on the NAS's small system disk).
    ##
    ##  At start the log also says how much room each folder has, and warns when it
    ##  is almost none, or when a folder is not a mounted volume. And dolqd refuses a
    ##  download that would leave less than 100 MB free on its disk, saying so in the
    ##  error, so a wrong path cannot fill a small disk and take the NAS's own
    ##  services down with it.
    volumes:

      ##  Everything dolqd keeps: the message history (history.db), the access
      ##  token, and the TLS certificate and key. It survives upgrades, and can be
      ##  backed up or moved as it is.
      - ./data:/data

      ##  Where XDCC downloads are saved. To save them somewhere else, such as
      ##  /volume1/video/anime, replace the line below with the longer form under
      ##  it. Leave the target as /downloads. A folder that Docker has to create is
      ##  handed to dolqd. One that already exists must be owned by, or writable for,
      ##  the user dolqd runs as (PUID and PGID above), or the log says it is not.
      - ./downloads:/downloads

      ##  The longer form, for a path on a share: it must exist, or nothing starts.
      #- type: bind
      #  source: /volume1/video/anime
      #  target: /downloads
      #  bind:
      #    create_host_path: false
