# Runs the Dolq backend (dolqd) standalone, reachable over the network - see
# backend/Dockerfile. `docker compose up -d`, then `docker compose logs dolqd`:
# on first start dolqd prints a pairing link (dolq://host:6789?token=...&fp=...),
# later only with `command: ['-print-pairing']`. Paste it
# into a client's Preferences > Remote Backend and it connects over TLS,
# already trusting the certificate. Nothing to configure: the access token and
# a self-signed certificate are generated on first start and kept in the data
# volume. Set DOLQ_PUBLIC_HOST to this machine's name/IP so the printed link
# has an address clients can reach (inside the container it can't tell).
# XDCC downloads are saved in the volume (/data/downloads), not where a
# client's Preferences point; set DOLQ_DOWNLOAD_DIR to save them elsewhere.
#
# On a NAS/cluster running Kubernetes see deploy/kubernetes/.
#
# dolqd accepts only TLS connections that present the access token. To keep
# clients from before access tokens working until they are paired, accept
# their plain, unauthenticated connections too with
# `command: ['-allow-legacy-plain']`. TLS and the token are independent:
# `-tls=false` serves plain TCP (behind a proxy or tunnel), `-token=false` drops
# the access token (a network you fully trust). Neither can be combined with
# -allow-legacy-plain.
#
# For a truly remote box with a domain name, add to the entrypoint
# `-acme-domain your.domain` (and publish host port 443 to 6789) to get a
# Let's Encrypt certificate automatically.
services:
  dolqd:
    build:
      context: ./backend
    environment:
      DOLQ_PUBLIC_HOST: ${DOLQ_PUBLIC_HOST:-}
      # DOLQ_TOKEN: set to choose the access token instead of a generated one
    ports:
      - '6789:6789'
    volumes:
      - dolq-data:/data
    restart: unless-stopped

volumes:
  dolq-data:
